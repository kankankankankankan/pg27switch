<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PG27UCDM ROG HUD Preview</title>
  <style>
    :root {
      color-scheme: dark light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      --rog-red: #eb141c;
      --dark-panel: rgba(15, 15, 16, 0.985);
      --dark-text: rgba(255, 255, 255, 0.95);
      --dark-muted: rgba(255, 255, 255, 0.62);
      --light-panel: rgba(242, 242, 243, 0.98);
      --light-text: rgba(19, 18, 19, 0.88);
      --light-muted: rgba(19, 18, 19, 0.55);
      --dark-gold: rgba(209, 168, 92, 0.48);
      --light-gold: rgba(168, 128, 56, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(135deg, #07080a 0%, #14161b 48%, #202329 100%);
      background-size: 48px 48px, 48px 48px, auto;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 18% 22%, rgba(235, 20, 28, 0.18), transparent 28%),
        radial-gradient(circle at 76% 12%, rgba(255, 255, 255, 0.10), transparent 22%);
      pointer-events: none;
    }

    .menubar {
      position: fixed;
      z-index: 2;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      color: rgba(255, 255, 255, 0.78);
      background: rgba(8, 9, 11, 0.60);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
    }

    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 74px 34px 102px;
    }

    .themes {
      width: min(100%, 1120px);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 30px;
      align-items: center;
    }

    .theme {
      display: grid;
      justify-items: center;
      gap: 14px;
      min-width: 0;
    }

    .theme-title {
      margin: 0;
      color: rgba(255, 255, 255, 0.56);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .hud-wrap {
      width: min(100%, 500px);
      padding: 32px;
      filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.28));
    }

    .hud {
      position: relative;
      width: 100%;
      aspect-ratio: 5 / 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 11px;
      overflow: hidden;
      border-radius: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow:
        inset 0 1px 0 var(--inner),
        0 16px 36px var(--shadow);
    }

    .hud::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 34px;
      background:
        linear-gradient(var(--accent), var(--accent)) top left / 100% 3px no-repeat,
        linear-gradient(var(--quiet), var(--quiet)) bottom 0 left 92px / calc(100% - 184px) 1px no-repeat,
        var(--header);
    }

    .hud::after {
      content: "";
      position: absolute;
      top: 15px;
      left: 24px;
      width: 38px;
      height: 8px;
      background:
        linear-gradient(135deg, transparent 0 32%, color-mix(in srgb, var(--accent), transparent 42%) 32% 50%, transparent 50%) 0 0 / 12px 8px repeat-x;
    }

    .hud .header-bracket {
      position: absolute;
      top: 14px;
      right: 10px;
      width: 48px;
      height: 14px;
      color: var(--quiet);
      pointer-events: none;
    }

    .hud .gold-ticks {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hud .gold-ticks::before,
    .hud .gold-ticks::after {
      content: "";
      position: absolute;
      right: 28px;
      width: 34px;
      height: 1px;
      background: var(--gold);
    }

    .hud .gold-ticks::before {
      top: 17px;
      width: 40px;
    }

    .hud .gold-ticks::after {
      bottom: 22px;
    }

    .hud .edition-strip {
      position: absolute;
      left: 50%;
      bottom: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 12px;
      color: var(--bottom-mark);
      font-size: 10px;
      font-weight: 750;
      line-height: 1;
      opacity: 0.48;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .edition-strip .flow {
      color: currentColor;
      font-variant-numeric: tabular-nums;
    }

    .edition-strip .dots {
      width: 34px;
      height: 10px;
      opacity: 0.62;
      background-image: radial-gradient(currentColor 1px, transparent 1.4px);
      background-size: 6px 5px;
    }

    .edition-strip .hatch {
      width: 24px;
      height: 10px;
      opacity: 0.62;
      background: repeating-linear-gradient(45deg, currentColor 0 3px, transparent 3px 6px);
    }

    .edition-strip .scan {
      width: 32px;
      height: 8px;
      opacity: 0.50;
      background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 5px);
    }

    .hud .side-rail {
      position: absolute;
      top: 56px;
      right: 24px;
      width: 1px;
      height: 52px;
      opacity: 0.18;
      background: var(--accent);
      pointer-events: none;
    }

    .hud .side-rail::before,
    .hud .side-rail::after {
      content: "";
      position: absolute;
      right: 0;
      width: 18px;
      height: 1px;
      background: var(--accent);
    }

    .hud .side-rail::before {
      top: 0;
    }

    .hud .side-rail::after {
      bottom: 0;
    }

    .hud .micro-grid {
      position: absolute;
      left: 26px;
      top: 62px;
      width: 36px;
      height: 26px;
      opacity: 0.12;
      background-image:
        linear-gradient(var(--quiet) 1px, transparent 1px),
        linear-gradient(90deg, var(--quiet) 1px, transparent 1px);
      background-size: 9px 9px;
      pointer-events: none;
    }

    .hud .corner-lines {
      position: absolute;
      inset: 18px 24px 20px;
      border: 0 solid transparent;
      pointer-events: none;
    }

    .corner-lines::before,
    .corner-lines::after {
      content: "";
      position: absolute;
      width: 54px;
      height: 28px;
      opacity: 0.38;
    }

    .corner-lines::before {
      left: 0;
      bottom: 0;
      border-left: 2px solid var(--quiet);
      border-bottom: 2px solid var(--quiet);
    }

    .corner-lines::after {
      right: 0;
      bottom: 0;
      border-right: 2px solid var(--quiet);
      border-bottom: 2px solid var(--quiet);
    }

    .dark {
      --panel: var(--dark-panel);
      --text: var(--dark-text);
      --muted: var(--dark-muted);
      --border: rgba(235, 20, 28, 0.46);
      --inner: rgba(255, 255, 255, 0.045);
      --shadow: rgba(0, 0, 0, 0.32);
      --accent: rgba(235, 20, 28, 0.86);
      --header: rgba(235, 20, 28, 0.095);
      --quiet: rgba(255, 255, 255, 0.075);
      --gold: var(--dark-gold);
      --bottom-mark: rgba(255, 255, 255, 0.18);
      --icon: rgba(235, 20, 28, 0.88);
      --cancel: rgba(235, 20, 28, 0.92);
    }

    .light {
      --panel: var(--light-panel);
      --text: var(--light-text);
      --muted: var(--light-muted);
      --border: rgba(189, 15, 20, 0.30);
      --inner: rgba(255, 255, 255, 0.78);
      --shadow: rgba(0, 0, 0, 0.17);
      --accent: rgba(189, 15, 20, 0.64);
      --header: rgba(189, 15, 20, 0.060);
      --quiet: rgba(0, 0, 0, 0.080);
      --gold: var(--light-gold);
      --bottom-mark: rgba(0, 0, 0, 0.14);
      --icon: rgba(189, 15, 20, 0.70);
      --cancel: rgba(184, 15, 20, 0.86);
    }

    .icon {
      position: absolute;
      z-index: 2;
      top: 1px;
      left: 50%;
      width: 34px;
      height: 34px;
      color: var(--icon);
      transform: translateX(-50%);
    }

    .label,
    .target,
    .count,
    .hint {
      position: relative;
      z-index: 1;
      margin: 0;
      text-align: center;
      letter-spacing: 0;
      transform: translateY(6px);
    }

    .label {
      color: var(--muted);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.1;
    }

    .target {
      color: var(--text);
      font-size: 35px;
      font-weight: 650;
      line-height: 1.08;
      max-width: calc(100% - 84px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .count {
      min-height: 78px;
      display: flex;
      align-items: center;
      color: var(--text);
      font-size: 72px;
      font-weight: 750;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .hint {
      color: var(--muted);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.15;
    }

    .cancel .label {
      font-weight: 520;
    }

    .cancel .count {
      color: var(--cancel);
      font-size: 68px;
      font-weight: 650;
    }

    .controls {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      transform: translateX(-50%);
      border-radius: 12px;
      background: rgba(8, 9, 11, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
    }

    button {
      height: 34px;
      min-width: 82px;
      padding: 0 12px;
      border: 0;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.88);
      background: rgba(255, 255, 255, 0.12);
      font: inherit;
      cursor: pointer;
    }

    button:hover,
    button.active {
      color: white;
      background: rgba(235, 20, 28, 0.52);
    }

    @media (max-width: 960px) {
      body {
        overflow: auto;
      }

      .themes {
        grid-template-columns: 1fr;
      }

      .stage {
        padding-top: 64px;
      }
    }
  </style>
</head>
<body>
  <div class="menubar">
    <span>PG27UCDM ROG HUD</span>
    <span>HiDPI 500 × 300</span>
  </div>

  <main class="stage">
    <div class="themes">
      <section class="theme dark" aria-label="Dark ROG theme">
        <p class="theme-title">深色 ROG 主题</p>
        <div class="hud-wrap">
          <article class="hud"></article>
        </div>
      </section>

      <section class="theme light" aria-label="Light ROG theme">
        <p class="theme-title">浅色 ROG 主题</p>
        <div class="hud-wrap">
          <article class="hud"></article>
        </div>
      </section>
    </div>
  </main>

  <nav class="controls" aria-label="Preview controls">
    <button type="button" data-state="3" class="active">倒计时 3</button>
    <button type="button" data-state="2">倒计时 2</button>
    <button type="button" data-state="1">倒计时 1</button>
    <button type="button" data-state="cancel">取消</button>
  </nav>

  <script>
    const stateButtons = Array.from(document.querySelectorAll("[data-state]"));
    const huds = Array.from(document.querySelectorAll(".hud"));
    const icon = `
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
        <path fill="currentColor" d="M1 5a1 1 0 0 0-1 1v3.191a1 1 0 0 0 .553.894l1.618.81a1 1 0 0 0 .447.105H15a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zm1.5 2h11a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-1 0V8H3v.5a.5.5 0 0 1-1 0v-1a.5.5 0 0 1 .5-.5"/>
      </svg>
    `;

    function setState(state) {
      stateButtons.forEach((button) => button.classList.toggle("active", button.dataset.state === state));
      const isCancelled = state === "cancel";

      huds.forEach((hud) => {
        hud.classList.toggle("cancel", isCancelled);
        hud.innerHTML = `
          ${icon}
          <span class="gold-ticks"></span>
          <span class="corner-lines"></span>
          <span class="side-rail"></span>
          <span class="micro-grid"></span>
          <p class="label">${isCancelled ? "已取消" : "切换屏幕输入源"}</p>
          <h1 class="target">DisplayPort</h1>
          <div class="count">${isCancelled ? "×" : state}</div>
          <p class="hint">${isCancelled ? "未切换屏幕输入源" : "ESC 取消"}</p>
          <span class="edition-strip">
            <span class="flow">0>>>1</span>
            <span class="dots"></span>
            <span class="hatch"></span>
            <span class="scan"></span>
          </span>
        `;
      });
    }

    stateButtons.forEach((button) => {
      button.addEventListener("click", () => setState(button.dataset.state));
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        setState("cancel");
      }
    });

    setState("3");
  </script>
</body>
</html>
